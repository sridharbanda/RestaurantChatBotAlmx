services:
  - type: web
    name: tabletalk-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        sync: false
